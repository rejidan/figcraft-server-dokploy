# nginx untuk figcraft-web — mengikuti contoh di packaging/web/README.md.
# .wasm HARUS application/wasm (browser menolak stream-compile kalau bukan),
# .js text/javascript, gzip untuk wasm/js/html, cache immutable untuk file
# ber-hash, no-cache untuk index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types { application/wasm wasm; text/javascript js; text/html html; }

    gzip on;
    gzip_types application/wasm text/javascript text/html;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
